<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroNav - Регистрация</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <h1>Създай профил</h1>

    <form>

        <label for="name">Име</label>
        <input type="text" id="name" placeholder="Въведи името си">

        <label for="email">Имейл</label>
        <input type="email" id="email" placeholder="Въведи имейла си">

        <label for="password">Парола</label>
        <input type="password" id="password" placeholder="Въведи парола">

        <label for="profile">Тип профил</label>

        <select id="profile">
            <option value="">Избери профил</option>
            <option value="home">Домашна градина</option>
            <option value="farm">Земеделски производител</option>
        </select>

        <label for="location">Местоположение</label>
        <input type="text" id="location" placeholder="Например: Велико Търново">

        <label for="crops">Култури</label>
        <input type="text" id="crops" placeholder="Например: домати, краставици">

        <button type="submit">Създай профил</button>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../script.js"></script>

</body>
</html>
