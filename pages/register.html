<!-- register.html -->
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroNav - Регистрация</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-page">

    <a href="#" class="global-logo" style="position:fixed; top:25px; left:40px; z-index:1000; font-family:var(--font-heading); font-size:22px; font-weight:700; color:var(--accent); text-decoration:none;">AG</a>

    <nav class="top-nav">
        <a href="../index.html" class="nav-link">Начало</a>
        <a href="../index.html#testimonials" class="nav-link">Мнения</a>
        <a href="../index.html#contacts" class="nav-link">Контакти</a>
        <a href="login.html" class="nav-link active">Вход / Регистрация</a>
    </nav>

    <div class="auth-card">
        <h1>Създай профил</h1>
        <p class="auth-subtitle">Добре дошли в AgroNav!</p>

        <form id="registerForm" novalidate>
            <div class="input-group">
                <input type="text" id="name" placeholder="Име" required>
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span class="error-text">Задължително поле</span>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Имейл адрес" required>
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <span class="error-text">Задължително поле</span>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Парола" required>
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
                <span class="error-text">Задължително поле</span>
            </div>
            <div class="input-group">
                <select id="profile" required style="color: #6b7280;">
                    <option value="" disabled selected>Тип профил</option>
                    <option value="home" style="color: #111827;">Домашна градина</option>
                    <option value="farm" style="color: #111827;">Земеделски производител</option>
                    <option value="flowers" style="color: #111827;">Цветя</option>
                </select>
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                <span class="error-text">Задължително поле</span>
            </div>
            <div class="input-group">
                <input type="text" id="location" placeholder="Населено място" required>
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span class="error-text">Задължително поле</span>
            </div>

            <!-- ИЗБОР НА ДИЗАЙН -->
            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom: 10px; color: var(--text-muted); font-size: 13px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px;">Избери дизайн</label>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                    <label style="cursor: pointer;">
                        <input type="radio" name="design_choice" value="vintage" checked style="display:none;">
                        <div style="border: 2px solid var(--border-glass); border-radius: 8px; padding: 4px; text-align:center; transition: 0.2s;">
                            <div style="height: 30px; background: #0A1C14; color:#D4AF37; display:flex; align-items:center; justify-content:center; font-family:'Cinzel'; font-weight:bold; border-radius:4px;">V</div>
                            <div style="font-size:10px; margin-top:4px; color:var(--text-main);">Vintage</div>
                        </div>
                    </label>
                    <label style="cursor: pointer;">
                        <input type="radio" name="design_choice" value="modern" style="display:none;">
                        <div style="border: 2px solid var(--border-glass); border-radius: 8px; padding: 4px; text-align:center; transition: 0.2s;">
                            <div style="height: 30px; background: #FDF6E3; color:#FF5F1F; display:flex; align-items:center; justify-content:center; font-family:'Archivo Black'; font-weight:bold; border-radius:4px; border:1px solid #111827;">M</div>
                            <div style="font-size:10px; margin-top:4px; color:var(--text-main);">Modern</div>
                        </div>
                    </label>
                    <label style="cursor: pointer;">
                        <input type="radio" name="design_choice" value="contrast" style="display:none;">
                        <div style="border: 2px solid var(--border-glass); border-radius: 8px; padding: 4px; text-align:center; transition: 0.2s;">
                            <div style="height: 30px; background: #000; color:#00FF00; display:flex; align-items:center; justify-content:center; font-family:sans-serif; font-weight:bold; border-radius:4px;">C</div>
                            <div style="font-size:10px; margin-top:4px; color:var(--text-main);">Contrast</div>
                        </div>
                    </label>
                </div>
            </div>
            <style>
                input[name="design_choice"]:checked + div { border-color: var(--accent) !important; box-shadow: var(--shadow-glow); transform: scale(1.05); }
            </style>

            <button type="submit" class="btn-primary">Създай профил</button>
        </form>

        <div class="auth-footer">
            <p>Вече имаш профил? <a href="login.html">Влез оттук</a></p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                input.type = "password";
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }
        document.getElementById('profile').addEventListener('change', function() { this.style.color = '#111827'; });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../theme.js"></script>
    <script src="../script.js"></script>
</body>
</html>
