<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroNav - Редактирай профила</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <a href="#" class="global-logo" style="position:fixed; top:25px; left:40px; z-index:1000; font-family:var(--font-heading); font-size:22px; font-weight:700; color:var(--accent); text-decoration:none;">AG</a>

    <nav class="top-nav">
        <a href="../welcome.html" class="nav-link">Начало</a>
        <a href="dashboard.html" class="nav-link">Градина</a>
        <a href="../news.html" class="nav-link">Новини</a>
        <a href="../game.html" class="nav-link">Игра</a>
    </nav>

    <div class="layout-container" style="max-width: 540px; margin-top: 120px;">
        <div class="dash-panel">
            <h1 class="text-center mb-20">Редактирай профила</h1>

            <div class="text-center mb-20">
                <div style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 16px; background: var(--bg-input); display: flex; justify-content: center; align-items: center; border: 1px solid var(--accent); overflow: hidden;">
                    <svg id="avatar-default-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:40px; height:40px; color:var(--text-muted);">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <img id="avatar-preview-img" src="" alt="Preview" style="display: none; width:100%; height:100%; object-fit:cover;">
                </div>
                <label for="avatar-file" class="btn-secondary" style="cursor:pointer; padding: 8px 16px; height: 36px; font-size: 12px;">Смени снимката</label>
                <input type="file" id="avatar-file" accept="image/*" style="display: none;">
                <span id="avatar-upload-msg" style="font-size:12px; color:var(--success); margin-top:8px; display:block;"></span>
            </div>

            <form id="editProfileForm">
                <div class="input-group">
                    <label>Име</label>
                    <input type="text" id="edit-name" placeholder="Въведи името си" required style="padding-left: 14px;">
                </div>

                <div class="input-group">
                    <label>Имейл (не може да се променя)</label>
                    <input type="email" id="edit-email" disabled style="padding-left: 14px;">
                </div>

                <div class="input-group">
                    <label>Местоположение</label>
                    <input type="text" id="edit-location" placeholder="Например: Велико Търново" required style="padding-left: 14px;">
                </div>

                <div class="input-group">
                    <label>Тип профил</label>
                    <select id="edit-profile-type" style="padding-left: 14px;">
                        <option value="home">Домашна градина</option>
                        <option value="farm">Земеделски производител</option>
                    </select>
                </div>

                <div class="input-group">
                    <label style="display:block; margin-bottom: 10px; color: var(--text-muted); font-size: 13px; font-weight: 600;">Избери дизайн</label>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                        <label style="cursor: pointer;">
                            <input type="radio" name="design_choice" value="vintage" style="display:none;">
                            <div style="border: 2px solid var(--border-glass); border-radius: 8px; padding: 4px; text-align:center;">
                                <div style="height: 30px; background: #0A1C14; color:#D4AF37; display:flex; align-items:center; justify-content:center; font-family:'Cinzel'; font-weight:bold; border-radius:4px;">V</div>
                            </div>
                        </label>
                        <label style="cursor: pointer;">
                            <input type="radio" name="design_choice" value="modern" style="display:none;">
                            <div style="border: 2px solid var(--border-glass); border-radius: 8px; padding: 4px; text-align:center;">
                                <div style="height: 30px; background: #FDF6E3; color:#FF5F1F; display:flex; align-items:center; justify-content:center; font-family:'Archivo Black'; font-weight:bold; border-radius:4px;">M</div>
                            </div>
                        </label>
                        <label style="cursor: pointer;">
                            <input type="radio" name="design_choice" value="contrast" style="display:none;">
                            <div style="border: 2px solid var(--border-glass); border-radius: 8px; padding: 4px; text-align:center;">
                                <div style="height: 30px; background: #000; color:#00FF00; display:flex; align-items:center; justify-content:center; font-family:sans-serif; font-weight:bold; border-radius:4px;">C</div>
                            </div>
                        </label>
                    </div>
                </div>
                <style>input[name="design_choice"]:checked + div { border-color: var(--accent) !important; box-shadow: var(--shadow-glow); }</style>

                <div style="display:flex; gap:12px; margin-top:20px;">
                    <button type="submit" class="btn-primary" style="flex:1;">Запази</button>
                    <a href="../welcome.html" class="btn-secondary" style="flex:1;">Отказ</a>
                </div>
                <p id="edit-message" class="text-center mt-20" style="color: var(--success); font-weight:600; font-size:13px;"></p>
            </form>

            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-glass);">
                <button type="button" id="show-delete-btn" class="btn-danger w-full">🗑️ Изтрий профила</button>
                <div id="delete-confirm-box" style="display: none; margin-top: 15px; padding: 20px; background: var(--bg-input); border: 1px solid var(--accent-danger); border-radius: var(--radius-md);">
                    <p style="font-size: 13px; color: var(--text-main); margin-bottom: 12px;">Напишете <strong>изтрий</strong>, за да потвърдите:</p>
                    <input type="text" id="delete-confirm-input" placeholder="изтрий" autocomplete="off" style="width:100%; padding:12px; border:1px solid var(--border-glass); border-radius:var(--radius-sm); background:var(--bg-main); color:white; margin-bottom:15px;">
                    <div style="display:flex; gap:10px;">
                        <button type="button" id="cancel-delete-btn" class="btn-secondary" style="flex:1;">Отказ</button>
                        <button type="button" id="confirm-delete-btn" class="btn-danger" style="flex:1; background:var(--accent-danger); color:white;" disabled>Потвърди</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../theme.js"></script>
    <script>
        let currentUser = null; let currentAvatarUrl = null;
        let originalProfileType = "home";

        async function loadProfileForEdit() {
            if (typeof supabaseClient === "undefined") return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "login.html"; return; }
            currentUser = session.user;

            const { data: profileData } = await supabaseClient.from("profiles").select("name, profile_type, location, avatar_url, design_theme").eq("id", currentUser.id).maybeSingle();
            const profile = profileData || { name: currentUser.email ? currentUser.email.split("@")[0] : "", profile_type: "home", location: "", avatar_url: null, design_theme: "vintage" };

            document.querySelector("#edit-name").value = profile.name || "";
            document.querySelector("#edit-email").value = currentUser.email || "";
            document.querySelector("#edit-location").value = profile.location || "";
            document.querySelector("#edit-profile-type").value = profile.profile_type || "home";
            originalProfileType = profile.profile_type;

            const userDesign = profile.design_theme || 'vintage';
            const designRadio = document.querySelector(`input[name="design_choice"][value="${userDesign}"]`);
            if (designRadio) designRadio.checked = true;

            if (profile.avatar_url) {
                currentAvatarUrl = profile.avatar_url;
                document.querySelector("#avatar-default-svg").style.display = "none";
                const img = document.querySelector("#avatar-preview-img");
                img.src = currentAvatarUrl; img.style.display = "block";
            }
        }
        loadProfileForEdit();

        document.querySelectorAll('input[name="design_choice"]').forEach(radio => {
            radio.addEventListener('change', (e) => { if (typeof window.changeDesignTheme === 'function') window.changeDesignTheme(e.target.value); });
        });

        document.querySelector("#avatar-file").addEventListener("change", async function (event) {
            const file = event.target.files[0]; if (!file) return;
            const avatarMsg = document.querySelector("#avatar-upload-msg");
            if (file.size > 2 * 1024 * 1024) { avatarMsg.textContent = "Грешка: Файлът е твърде голям (макс 2MB)."; avatarMsg.style.color = "var(--accent-danger)"; return; }
            avatarMsg.textContent = "Качване..."; avatarMsg.style.color = "var(--accent)";
            const fileExt = file.name.split('.').pop(); const fileName = `${Date.now()}.${fileExt}`; const filePath = `${currentUser.id}/${fileName}`;
            try {
                const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(filePath, file, { upsert: true });
                if (uploadError) throw uploadError;
                const { data: { publicUrl } } = supabaseClient.storage.from('avatars').getPublicUrl(filePath);
                const { error: dbError } = await supabaseClient.from("profiles").update({ avatar_url: publicUrl }).eq("id", currentUser.id);
                if (dbError) throw dbError;
                currentAvatarUrl = publicUrl; document.querySelector("#avatar-default-svg").style.display = "none";
                const img = document.querySelector("#avatar-preview-img"); img.src = publicUrl; img.style.display = "block";
                avatarMsg.textContent = "✅ Снимката е обновена!"; avatarMsg.style.color = "var(--success)";
            } catch (error) { avatarMsg.textContent = "Грешка: " + error.message; avatarMsg.style.color = "var(--accent-danger)"; }
        });

        document.querySelector("#editProfileForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const message = document.querySelector("#edit-message");
            if (!currentUser) { message.textContent = "Грешка: Няма сесия."; return; }
            const newName = document.querySelector("#edit-name").value.trim();
            const newLocation = document.querySelector("#edit-location").value.trim();
            const newProfileType = document.querySelector("#edit-profile-type").value;
            const newDesign = document.querySelector('input[name="design_choice"]:checked')?.value || 'vintage';
            
            if (!newName || !newLocation || !newProfileType) { message.textContent = "Моля, попълни всички полета."; return; }
            message.textContent = "Запазване..."; message.style.color = "var(--accent)";
            
            try {
                const { error } = await supabaseClient.from("profiles").upsert({ id: currentUser.id, name: newName, location: newLocation, profile_type: newProfileType, avatar_url: currentAvatarUrl, design_theme: newDesign }, { onConflict: "id" });
                if (error) throw error;
                message.textContent = "✅ Профилът е обновен успешно.";
                setTimeout(() => { window.location.href = "../welcome.html"; }, 1000);
            } catch (e) { message.textContent = "Неочаквана грешка: " + e.message; message.style.color = "var(--accent-danger)"; }
        });

        document.querySelector("#show-delete-btn").addEventListener("click", () => { document.querySelector("#delete-confirm-box").style.display = "block"; document.querySelector("#show-delete-btn").style.display = "none"; });
        document.querySelector("#cancel-delete-btn").addEventListener("click", () => { document.querySelector("#delete-confirm-box").style.display = "none"; document.querySelector("#show-delete-btn").style.display = "block"; document.querySelector("#delete-confirm-input").value = ""; document.querySelector("#confirm-delete-btn").disabled = true; });
        document.querySelector("#delete-confirm-input").addEventListener("input", (e) => { document.querySelector("#confirm-delete-btn").disabled = e.target.value.trim().toLowerCase() !== "изтрий"; });
        document.querySelector("#confirm-delete-btn").addEventListener("click", async () => {
            const btn = document.querySelector("#confirm-delete-btn"); btn.textContent = "Изтриване..."; btn.disabled = true;
            const { error } = await supabaseClient.rpc("delete_user");
            if (error) { await showAlert("Грешка при изтриване: " + error.message, "Грешка"); btn.textContent = "Потвърди"; btn.disabled = false; return; }
            await supabaseClient.auth.signOut(); window.location.href = "../index.html";
        });
    </script>
</body>
</html>
