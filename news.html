<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroNav - Новини</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-header">
        <div class="dashboard-header-left">
            <a href="welcome.html" class="dashboard-back-btn">
                <span>←</span> Назад
            </a>
        </div>
        <div class="dashboard-header-right">
            <div class="dashboard-datetime">
                <div id="date"></div>
                <div id="clock"></div>
            </div>
        </div>
    </div>

    <div class="news-page-container">
        <h2 style="color: var(--forest-deep); font-family: 'Lora', serif; text-align: center; margin-top: 40px; font-size: 32px;">
            📰 Новини от земеделския свят
        </h2>
        <p style="text-align: center; color: var(--forest-deep); opacity: 0.7;">
            Актуални новини от българските медии
        </p>

        <div id="news-grid" class="news-grid">
            <p style="text-align: center; grid-column: 1 / -1;">Зареждане на новини...</p>
        </div>

        <button id="reload-news-btn" class="btn-reload-news">
            🔄 Обнови новините
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
    function updateDateTime() {
        const now = new Date();
        const dateEl = document.querySelector("#date");
        const clockEl = document.querySelector("#clock");
        if (dateEl) dateEl.textContent = now.toLocaleDateString("bg-BG", { day: "2-digit", month: "long", year: "numeric" });
        if (clockEl) clockEl.textContent = now.toLocaleTimeString("bg-BG", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    function timeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        let interval = seconds / 31536000; if (interval > 1) return Math.floor(interval) + " г.";
        interval = seconds / 2592000; if (interval > 1) return Math.floor(interval) + " м.";
        interval = seconds / 86400; if (interval > 1) return Math.floor(interval) + " дни";
        interval = seconds / 3600; if (interval > 1) return Math.floor(interval) + " ч.";
        interval = seconds / 60; if (interval > 1) return Math.floor(interval) + " мин.";
        return Math.floor(seconds) + " сек.";
    }

    async function loadNews() {
        const grid = document.getElementById("news-grid");
        grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Зареждане на новини...</p>';

        try {
            // Извикваме нашата Supabase Edge Function
            const { data, error } = await supabaseClient.functions.invoke('get-news');

            if (error) throw error;

            let articles = data || [];
            
            if (articles.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Няма намерени новини.</p>';
                return;
            }

            const newsToShow = articles.slice(0, 15);

            grid.innerHTML = "";
            newsToShow.forEach(article => {
                const pubDate = new Date(article.pubDate);
                const timeAgoStr = timeAgo(pubDate);
                const source = article.source || "Agro News";
                const title = article.title || "Без заглавие";
                const link = article.link || "#";

                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <h3>${title}</h3>
                    <div class="news-meta">
                        <span>🕘 Преди ${timeAgoStr}</span>
                        <span>🌐 ${source}</span>
                    </div>
                    <a href="${link}" target="_blank" class="btn-read-more">Прочети повече →</a>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error("Грешка при новините:", error);
            grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #d32f2f;">Възникна грешка при зареждането.</p>';
        }
    }

    loadNews();
    document.getElementById("reload-news-btn").addEventListener("click", loadNews);
    </script>
</body>
</html>
