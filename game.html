<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroNav - Мини Игра</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: radial-gradient(circle at center, #a3c47d 0%, #7cb342 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Спира скролването, докато играем */
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
            align-items: center;
            padding: 0 10px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Стъклен ефект за брояча на монети */
        .score-board {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-size: 24px;
            font-weight: 900;
            color: var(--forest-deep);
            box-shadow: 0 8px 32px rgba(27, 67, 44, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-board span#coin-count {
            color: #d4af37; /* Златисто */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Скриване и показване на текста/емоджито спрямо екрана */
        .coin-text { display: inline; }
        .coin-icon { display: none; font-size: 26px; }

        .btn-back-game, .btn-reset {
            background: rgba(255, 255, 255, 0.8);
            color: var(--forest);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .btn-reset {
            color: #b03030;
        }

        .btn-back-game:hover, .btn-reset:hover {
            background: white;
            transform: scale(1.05);
        }

        /* Платното за рисуване */
        canvas {
            background: #689f38; /* По-тъмно зелено за база */
            border-radius: 20px;
            border: 6px solid #f4f1de; /* Кремава рамка */
            box-shadow: 0 15px 40px rgba(27, 67, 44, 0.4), inset 0 0 50px rgba(0,0,0,0.2);
            touch-action: none;
            max-width: 100%;
            height: auto;
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 15px;
        }

        .mobile-controls button {
            width: 65px;
            height: 65px;
            font-size: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            color: var(--forest);
            border: 2px solid rgba(255,255,255,0.9);
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        .mobile-controls button:active {
            background: var(--moss);
            color: white;
            transform: scale(0.9);
        }

        @media (max-width: 768px) {
            /* Скриваме текста и показваме емоджито на телефон */
            .coin-text { display: none; }
            .coin-icon { display: inline; }

            .mobile-controls {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                justify-items: center;
            }
            .mobile-controls .empty {
                visibility: hidden;
            }
            .game-header {
                flex-direction: column;
                gap: 15px;
            }
            .header-actions {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
            .score-board {
                font-size: 20px;
                padding: 6px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <a href="welcome.html" class="btn-back-game">← Назад</a>
            
            <div class="header-actions">
                <div class="score-board">
                    <span class="coin-text">Монети:</span>
                    <span class="coin-icon">🪙</span>
                    <span id="coin-count">0</span>
                </div>
                <button id="reset-game" class="btn-reset">🔄 Започни отначало</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="700" height="500"></canvas>

        <!-- Бутони за телефон -->
        <div class="mobile-controls">
            <div class="empty"></div>
            <button onpointerdown="setMobileDir('up')" onpointerup="setMobileDir(null)">↑</button>
            <div class="empty"></div>
            <button onpointerdown="setMobileDir('left')" onpointerup="setMobileDir(null)">←</button>
            <button onpointerdown="setMobileDir('down')" onpointerup="setMobileDir(null)">↓</button>
            <button onpointerdown="setMobileDir('right')" onpointerup="setMobileDir(null)">→</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("coin-count");

        // --- 1. СИСТЕМА ЗА ЗВУК ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playChaChing() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'sine'; osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(987.77, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(987.77, audioCtx.currentTime);
            osc1.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1);
            osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.start(); osc2.start();
            osc1.stop(audioCtx.currentTime + 0.4); osc2.stop(audioCtx.currentTime + 0.4);
        }

        // --- 2. ИГРОВИ ПРОМЕНЛИВИ ---
        let coins = parseInt(localStorage.getItem("agronavCoins") || "0");
        scoreEl.textContent = coins;

        const tractor = { 
            x: canvas.width / 2, 
            y: canvas.height / 2, 
            speed: 2.0, // НАМАЛЕНА СКОРОСТ ОЩЕ МАЛКО (беше 3.2)
            angle: 0, 
            targetAngle: 0
        };
        
        let crops = [];
        let particles = []; 
        let floatingTexts = []; 
        const keys = {};
        let mobileDir = null;

        const emojis = ["🌾", "🍅", "🥕", "🌽", "🍎"];
        const fieldRows = []; 

        for (let i = 0; i < canvas.width; i += 60) {
            fieldRows.push(i);
        }

        // --- 3. УПРАВЛЕНИЕ (Оправено за WASD на всяка клавиатура) ---
        window.addEventListener("keydown", e => {
            keys[e.code] = true; // Използваме e.code, за да хващаме физическите клавиши
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
                e.preventDefault(); // Спира скролването на страницата
            }
        });
        window.addEventListener("keyup", e => keys[e.code] = false);

        function setMobileDir(dir) { mobileDir = dir; }

        // --- 4. СЪЗДАВАНЕ НА РЕКОЛТА ---
        function spawnCrops() {
            crops = [];
            for (let i = 0; i < 6; i++) {
                crops.push({
                    x: Math.random() * (canvas.width - 80) + 40,
                    y: Math.random() * (canvas.height - 80) + 40,
                    emoji: emojis[Math.floor(Math.random() * emojis.length)],
                    collected: false,
                    timeOffset: Math.random() * Math.PI * 2
                });
            }
        }
        spawnCrops();

        // --- 5. ЧАСТИЦИ ---
        function createParticles(x, y, type) {
            const count = type === "dust" ? 2 : 8;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * (type === "dust" ? 3 : 6),
                    vy: (Math.random() - 0.5) * (type === "dust" ? 3 : 6),
                    life: 1,
                    maxLife: type === "dust" ? 0.5 : 0.8,
                    color: type === "dust" ? "rgba(150, 120, 90, 0.6)" : "rgba(255, 215, 0, 0.9)",
                    size: type === "dust" ? Math.random() * 5 + 2 : Math.random() * 4 + 1
                });
            }
        }

        // --- 6. ЛОГИКА ЗА "ЗАПОЧНИ ОТНАЧАЛО" ---
        document.getElementById("reset-game").addEventListener("click", () => {
            if(confirm("Сигурни ли сте, че искате да започнете отначало? Всички монети ще бъдат изтрити.")) {
                coins = 0;
                scoreEl.textContent = 0;
                localStorage.setItem("agronavCoins", 0);
                
                tractor.x = canvas.width / 2;
                tractor.y = canvas.height / 2;
                tractor.angle = 0;
                tractor.targetAngle = 0;
                
                spawnCrops();
                particles = [];
                floatingTexts = [];
            }
        });

        // --- 7. ИГРОВА ЛОГИКА ---
        function update(dt) {
            let dx = 0, dy = 0;
            let moving = false;

            // Използваме e.code (ArrowUp, KeyW, KeyA, KeyS, KeyD)
            if (keys["ArrowUp"] || keys["KeyW"] || mobileDir === "up") { dy -= 1; tractor.targetAngle = -Math.PI / 2; moving = true; }
            if (keys["ArrowDown"] || keys["KeyS"] || mobileDir === "down") { dy += 1; tractor.targetAngle = Math.PI / 2; moving = true; }
            if (keys["ArrowLeft"] || keys["KeyA"] || mobileDir === "left") { dx -= 1; tractor.targetAngle = Math.PI; moving = true; }
            if (keys["ArrowRight"] || keys["KeyD"] || mobileDir === "right") { dx += 1; tractor.targetAngle = 0; moving = true; }

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071; dy *= 0.7071;
                if (dx > 0) tractor.targetAngle = dy > 0 ? Math.PI / 4 : -Math.PI / 4;
                else if (dx < 0) tractor.targetAngle = dy > 0 ? Math.PI * 0.75 : -Math.PI * 0.75;
            }

            let angleDiff = tractor.targetAngle - tractor.angle;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            tractor.angle += angleDiff * 0.15;

            tractor.x += dx * tractor.speed;
            tractor.y += dy * tractor.speed;

            if (tractor.x < 30) tractor.x = 30;
            if (tractor.x > canvas.width - 30) tractor.x = canvas.width - 30;
            if (tractor.y < 30) tractor.y = 30;
            if (tractor.y > canvas.height - 30) tractor.y = canvas.height - 30;

            if (moving && Math.random() < 0.3) {
                const backX = tractor.x - Math.cos(tractor.angle) * 25;
                const backY = tractor.y - Math.sin(tractor.angle) * 25;
                createParticles(backX, backY, "dust");
            }

            crops.forEach(crop => {
                if (!crop.collected) {
                    const dist = Math.hypot(tractor.x - crop.x, tractor.y - crop.y);
                    if (dist < 40) { 
                        crop.collected = true;
                        coins++;
                        scoreEl.textContent = coins;
                        localStorage.setItem("agronavCoins", coins);
                        
                        playChaChing(); 
                        createParticles(crop.x, crop.y, "spark");
                        floatingTexts.push({ x: crop.x, y: crop.y - 20, text: "+1", life: 1 });
                    }
                }
            });

            if (crops.every(c => c.collected)) {
                spawnCrops();
            }

            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                p.life -= dt / p.maxLife;
            });
            particles = particles.filter(p => p.life > 0);

            floatingTexts.forEach(t => {
                t.y -= 1.5;
                t.life -= dt * 1.2;
            });
            floatingTexts = floatingTexts.filter(t => t.life > 0);
        }

        // --- 8. РИСУВАНЕ ---
        function drawEmoji(emoji, x, y, size) {
            ctx.font = `${size}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(emoji, x, y);
        }

        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        }

        function drawTractor() {
            ctx.save();
            ctx.translate(tractor.x, tractor.y);
            ctx.rotate(tractor.angle);

            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.beginPath();
            ctx.ellipse(0, 8, 25, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#222";
            ctx.fillRect(-22, -22, 20, 12); 
            ctx.fillRect(-22, 10, 20, 12);  
            ctx.fillRect(14, -16, 12, 8);   
            ctx.fillRect(14, 8, 12, 8);     
            
            ctx.fillStyle = "#c62828"; 
            ctx.beginPath();
            ctx.roundRect(-16, -16, 34, 32, 6);
            ctx.fill();

            ctx.fillStyle = "#8e0000";
            ctx.beginPath();
            ctx.roundRect(2, -12, 16, 24, 4);
            ctx.fill();

            ctx.fillStyle = "#81d4fa";
            ctx.beginPath();
            ctx.roundRect(-12, -10, 14, 20, 4);
            ctx.fill();
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = "#ffeb3b";
            ctx.beginPath();
            ctx.arc(18, -8, 4, 0, Math.PI * 2);
            ctx.arc(18, 8, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#5d8c2e"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(0,0,0,0.08)";
            ctx.lineWidth = 20;
            fieldRows.forEach(x => {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            });

            crops.forEach(crop => {
                if (!crop.collected) {
                    let floatY = Math.sin(Date.now() / 300 + crop.timeOffset) * 3;
                    drawEmoji(crop.emoji, crop.x, crop.y + floatY, 35);
                }
            });

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            drawTractor();

            floatingTexts.forEach(t => {
                ctx.globalAlpha = t.life;
                ctx.fillStyle = "#ffeb3b"; 
                ctx.font = "bold 26px 'Nunito Sans', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                ctx.shadowBlur = 6;
                ctx.fillText(t.text, t.x, t.y);
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;
        }

        // --- 9. ИГРОВИ ЦИКЪЛ ---
        let lastTime = performance.now();
        function gameLoop(time) {
            const dt = (time - lastTime) / 1000; 
            lastTime = time;

            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
